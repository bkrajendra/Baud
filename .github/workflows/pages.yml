name: Publish landing page

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/logo.png
      - docs/hero.png
      - docs/app-icon.png
      - .github/pages/template.html
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure pandoc is available
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi

      - name: Convert README to HTML body
        run: pandoc README.md -f gfm -t html --wrap=none -o /tmp/body.html

      - name: Fix asset paths and external links
        run: |
          python3 - <<'PYEOF'
          import re

          with open('/tmp/body.html', encoding='utf-8') as f:
              body = f.read()

          # Assets live alongside index.html inside docs/, so strip the docs/ prefix.
          body = re.sub(r'(src|href)="docs/', r'\1="', body)

          # Any other relative link (not http(s), not an in-page anchor, not one
          # of this page's own assets) points at a repo-root file — resolve it
          # against GitHub so it still works from the published page.
          own_assets = ('logo.png', 'hero.png', 'app-icon.png')

          def fix_link(match):
              url = match.group(1)
              if url.startswith(('http://', 'https://', '#')) or url in own_assets:
                  return match.group(0)
              return f'href="https://github.com/bkrajendra/Baud/blob/main/{url}"'

          body = re.sub(r'href="([^"]+)"', fix_link, body)

          with open('/tmp/body.html', 'w', encoding='utf-8') as f:
              f.write(body)
          PYEOF

      - name: Render landing page from template
        run: |
          python3 - <<'PYEOF'
          with open('.github/pages/template.html', encoding='utf-8') as f:
              template = f.read()
          with open('/tmp/body.html', encoding='utf-8') as f:
              body = f.read()
          page = template.replace('__TITLE__', 'Baud — Serial. Simple. Fast.').replace('__BODY__', body)
          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(page)
          PYEOF

      - name: Write CNAME for custom domain
        run: echo "baud.rajendrakhope.com" > docs/CNAME

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/CNAME
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: regenerate docs/index.html from README [skip ci]"
          git push
