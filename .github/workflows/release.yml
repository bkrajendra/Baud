name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        shell: python3 {0}
        run: |
          import os
          import re

          with open("Cargo.toml") as f:
              toml = f.read()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', toml, re.MULTILINE)
          major, minor, patch = match.groups()
          new_version = f"{major}.{minor}.{int(patch) + 1}"
          toml = toml[: match.start()] + f'version = "{new_version}"' + toml[match.end() :]
          with open("Cargo.toml", "w") as f:
              f.write(toml)

          # Patch Cargo.lock's own "baud" package entry directly instead of
          # running `cargo check` here — this job has no build toolchain
          # dependencies installed (libudev/pkg-config etc.), which a full
          # cargo invocation would require just to bump a version string.
          with open("Cargo.lock") as f:
              lock = f.read()
          lock, count = re.subn(
              r'(name = "baud"\nversion = ")[^"]+(")',
              rf"\g<1>{new_version}\g<2>",
              lock,
              count=1,
          )
          assert count == 1, "expected to find exactly one baud package entry in Cargo.lock"
          with open("Cargo.lock", "w") as f:
              f.write(lock)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
              f.write(f"tag=v{new_version}\n")

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin HEAD:main
          git push origin ${{ steps.bump.outputs.tag }}

  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libgtk-3-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Determine target triple
        id: triple
        shell: bash
        run: |
          echo "triple=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "baud-${{ needs.bump-version.outputs.tag }}-${{ steps.triple.outputs.triple }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/baud.exe $name/
          Copy-Item README.md,LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          echo "asset=$name.zip" >> $env:GITHUB_ENV

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="baud-${{ needs.bump-version.outputs.tag }}-${{ steps.triple.outputs.triple }}"
          mkdir "$name"
          cp target/release/baud "$name"/
          cp README.md LICENSE "$name"/
          tar -czf "$name.tar.gz" "$name"
          echo "asset=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Wrap the binary in a .app bundle. A bare Unix executable has no
          # way to tell Finder it's a GUI app, so double-clicking it falls
          # back to opening Terminal and running it there.
          name="baud-${{ needs.bump-version.outputs.tag }}-${{ steps.triple.outputs.triple }}"
          app="$name/Baud.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          cp target/release/baud "$app/Contents/MacOS/baud"
          chmod +x "$app/Contents/MacOS/baud"

          iconset="AppIcon.iconset"
          mkdir "$iconset"
          sips -z 16 16 docs/app-icon.png --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 docs/app-icon.png --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 docs/app-icon.png --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 docs/app-icon.png --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 docs/app-icon.png --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 docs/app-icon.png --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 docs/app-icon.png --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 docs/app-icon.png --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 docs/app-icon.png --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 docs/app-icon.png --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          rm -rf "$iconset"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Baud</string>
              <key>CFBundleDisplayName</key>
              <string>Baud</string>
              <key>CFBundleIdentifier</key>
              <string>com.bkrajendra.baud</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.bump-version.outputs.version }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.bump-version.outputs.version }}</string>
              <key>CFBundleExecutable</key>
              <string>baud</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          cp README.md LICENSE "$name"/
          ditto -c -k --sequesterRsrc --keepParent "$name" "$name.zip"
          echo "asset=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: baud-${{ matrix.os }}
          path: ${{ env.asset }}

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ${{ needs.bump-version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
