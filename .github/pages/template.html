<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a2e;
    --muted: #5b6472;
    --accent: #3b82f6;
    --border: #e5e7eb;
    --code-bg: #f5f7fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --fg: #e8eaed;
      --muted: #9aa4b2;
      --accent: #6ea8fe;
      --border: #262b36;
      --code-bg: #171b24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header a.brand { display: flex; align-items: center; text-decoration: none; }
  header img { height: 32px; }
  header nav a {
    color: var(--fg);
    text-decoration: none;
    margin-left: 1.5rem;
    font-weight: 600;
  }
  header nav a:hover { color: var(--accent); }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  main img { max-width: 100%; height: auto; border-radius: 8px; }
  main p[align="center"], main div[align="center"] { text-align: center; }
  h1, h2, h3 { line-height: 1.25; }
  a { color: var(--accent); }
  code, pre {
    background: var(--code-bg);
    border-radius: 6px;
  }
  pre { padding: 1rem; overflow-x: auto; }
  code { padding: 0.15em 0.4em; }
  pre code { padding: 0; }
  blockquote {
    border-left: 3px solid var(--accent);
    margin: 1rem 0;
    padding: 0.25rem 1rem;
    color: var(--muted);
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--border); padding: 0.5rem; text-align: left; }
  footer {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }
</style>
